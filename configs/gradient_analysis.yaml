# MTL gradient analysis configuration. All quantities are user-adjustable.

tasks: [det, map, motion, plan]

adapter: hipad
ckpt_root: ckpts/E2_E1_stage2_18ep
model_config: ckpts/E2_E1_stage2_18ep/E2_E1_stage2_18ep.py

checkpoints:
  1ep:  iter_2344.pth
  3ep:  iter_7032.pth
  6ep:  iter_14064.pth
  18ep: iter_42192.pth

primary:
  batch_size: 6
  num_batches: 100

supplementary:
  enabled: true
  batch_size: 1
  num_samples: 500
  checkpoint: 1ep

probe:
  alpha: 0.001
  steps: [1]
  variants: [raw, normalized]
  # When non-empty, M3 restricts the virtual update to these shared param
  # group keys (one cycle per layer). Output gains a `layer` column and
  # per-layer ΔL matrices. Leave empty/null for the original full-param
  # update. Override at the CLI with --probe-layers.
  # Allowed values match `shared_param_groups` after grouping, e.g.:
  #   dec0_norm_0, dec3_ffn_0, dec5_gnn_0, fc_before, fc_after
  target_layers: []
  # Pin Hungarian matching (det/map) and mode argmin (motion/plan) to the
  # baseline forward across the entire probe cycle. Strongly recommended
  # whenever target loss change can be confused with matching reshuffling.
  # Override at the CLI with --freeze-matching / --no-freeze-matching.
  #
  # NOTE (2026-04-30): freeze_matching previously appeared "broken" (drift
  # ~100x on repeated forwards) but the real bugs were leaks elsewhere —
  # see diag_forward_determinism.py [F]. After fixing them, drift collapses
  # to ~0 with all three knobs on. Fixes (in tools/gradient_analysis/):
  #   1. temporal_state.py:_bank_holders — banks live nested inside the
  #      head (head.onedecoder_head.det_instance_bank), not on raw model.
  #      Now walks the full module tree; previously snapshotted ZERO banks.
  #   2. temporal_state.py:_sampler_holders — det/map ``BaseTargetWithDenoising``
  #      samplers cache ``dn_metas`` via ``cache_dn`` which leaks into the
  #      next forward via ``update_dn``, changing the decoder's control
  #      flow (extra anchors). Samplers aren't nn.Module so we discover
  #      them via *_sampler attrs on every nn.Module.
  #   3. matching_freeze.py:per_forward_seed — also reseeds numpy and
  #      ``random``. ``GridMask.forward`` uses ``np.random.rand/randint``
  #      so without numpy reset the augmented input image differs across
  #      forwards (was the dominant non-determinism source).
  freeze_matching: true
  # Restore InstanceBank temporal cache + sampler dn_metas + run_step
  # before every forward inside the probe cycle. Without this, baseline /
  # grad / stepped forwards see different temporal state because each
  # forward calls ``bank.cache(...)`` and ``sampler.cache_dn(...)``.
  # Default mirrors `freeze_matching` — leave null to inherit, true/false
  # to override. CLI: --reset-temporal-state / --no-reset-temporal-state.
  reset_temporal_state: true
  # Per-forward RNG seed (DN noise + GridMask augmentation determinism).
  # Falls back to the top-level `seed` if omitted.
  forward_seed: 42

# M8 — gradient-direction loss surface (1D line probe). Computes
# L_target(θ - t·α·ĝ_source) for every source/target pair across a grid of
# `t`. Reuses `probe.alpha`, `probe.target_layers`, `probe.freeze_matching`,
# `probe.reset_temporal_state`, `probe.forward_seed`. Skipped unless `M8`
# appears in --modules. Cost ≈ num_batches × num_sources × num_layers ×
# len(t_grid) forwards, so defaults are intentionally small.
landscape:
  enabled: true
  num_batches: 5
  batch_size: null   # null → inherit from primary.batch_size
  t_grid: [-3.0, -2.0, -1.0, -0.5, -0.25, 0.0, 0.25, 0.5, 1.0, 2.0, 3.0]

binning:
  cosine_bins: [-1.0, -0.3, -0.1, 0.1, 0.3, 1.0]

shared_param_groups:
  - backbone
  - neck
  - norm
  - ffn
  - gnn
  - inter_gnn
  - fc_before
  - fc_after

output_root: gradient_analysis_results

# Phase 1 #1 — random-baseline / permutation test
null_baseline:
  n_repeats: 1000

# Phase 1 #3 — bootstrap CI augmentation on summary CSVs
bootstrap:
  enabled: true
  n_resamples: 2000

# Phase 1 #9 — α-sensitivity sweep (motion-only)
alpha_sweep:
  enabled: true
  alphas: [1.0e-4, 5.0e-4, 1.0e-3, 5.0e-3]
  sources: [motion]
  num_batches: 100
  checkpoint: 1ep

seed: 42
deterministic: true
fp16: true
device: cuda:0
